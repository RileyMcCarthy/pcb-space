[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-space"
version = "0.4.0"
description = "Zener schematic, then place/route/fab in front of KiCad"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Riley McCarthy" }]
keywords = ["pcb", "kicad", "zener", "placement", "routing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
source = ["easyeda2kicad"]

[project.scripts]
pcb-space = "pcb_space.cli:main"
pcb-source = "pcb_space.cli:source_main"

[project.urls]
Homepage = "https://github.com/RileyMcCarthy/pcb-space"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "kicad: needs kicad-cli (Gerbers / DRC / POS)",
]
