name: test
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not kicad"

  c3-usb-fab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad CLI
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - run: pip install -e ".[dev]"
      - name: c3_usb tests including fab
        run: pytest -q tests/test_c3_usb.py --tb=short
        env:
          KRT_HOME: ""
      - name: Produce JLC package
        run: pcb-space fab examples/c3_usb/c3_usb.place.py -o "$RUNNER_TEMP/c3_usb_fab"
      - uses: actions/upload-artifact@v4
        with:
          name: c3_usb-fab
          path: |
            ${{ runner.temp }}/c3_usb_fab/gerbers
            ${{ runner.temp }}/c3_usb_fab/bom.csv
            ${{ runner.temp }}/c3_usb_fab/cpl.csv
            ${{ runner.temp }}/c3_usb_fab/FAB_NOTES.md
            ${{ runner.temp }}/c3_usb_fab/*.drl
